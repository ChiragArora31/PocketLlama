<svg width="1280" height="820" viewBox="0 0 1280 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PocketLlama chat preview</title>
  <desc id="desc">A product screenshot style preview of the PocketLlama offline AI chat interface running on a phone.</desc>
  <rect width="1280" height="820" fill="#0F172A"/>
  <rect x="72" y="64" width="1136" height="692" rx="38" fill="#162235"/>
  <rect x="124" y="126" width="488" height="568" rx="44" fill="#0B1220"/>
  <rect x="144" y="146" width="448" height="528" rx="34" fill="#F8FAFC"/>
  <rect x="144" y="146" width="448" height="86" rx="34" fill="#111827"/>
  <rect x="144" y="198" width="448" height="34" fill="#111827"/>
  <circle cx="185" cy="187" r="18" fill="#22C55E"/>
  <text x="215" y="182" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">PocketLlama</text>
  <text x="215" y="205" fill="#A7F3D0" font-family="Inter, Arial, sans-serif" font-size="12">TinyLlama 1.1B Q4 - offline</text>
  <rect x="172" y="262" width="294" height="58" rx="18" fill="#E5E7EB"/>
  <text x="194" y="286" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="15">Can you summarize my notes</text>
  <text x="194" y="306" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="15">without sending them online?</text>
  <rect x="336" y="340" width="220" height="78" rx="18" fill="#2563EB"/>
  <text x="360" y="366" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15">Yes. Everything runs</text>
  <text x="360" y="386" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15">locally after the model</text>
  <text x="360" y="406" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15">download finishes.</text>
  <rect x="172" y="442" width="342" height="98" rx="18" fill="#E5E7EB"/>
  <text x="194" y="468" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="15">Give me a 3 bullet action plan</text>
  <text x="194" y="488" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="15">for a tiny on-device assistant.</text>
  <text x="194" y="520" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="12">10:42 AM</text>
  <rect x="176" y="586" width="312" height="44" rx="22" fill="#EEF2F7"/>
  <text x="202" y="614" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="15">Ask PocketLlama...</text>
  <circle cx="524" cy="608" r="22" fill="#22C55E"/>
  <path d="M516 608h16m0 0-6-6m6 6-6 6" stroke="#052E16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="688" y="200" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">Offline AI,</text>
  <text x="688" y="266" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">in your pocket.</text>
  <text x="690" y="322" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="22">A React Native + llama.rn chat app for running</text>
  <text x="690" y="352" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="22">TinyLlama directly on iOS and Android devices.</text>
  <rect x="690" y="418" width="168" height="54" rx="12" fill="#DCFCE7"/>
  <text x="718" y="452" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">100% local</text>
  <rect x="878" y="418" width="188" height="54" rx="12" fill="#DBEAFE"/>
  <text x="905" y="452" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">No API keys</text>
  <rect x="690" y="494" width="376" height="54" rx="12" fill="#FEF3C7"/>
  <text x="718" y="528" fill="#92400E" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">4-bit and 8-bit GGUF models</text>
  <rect x="690" y="604" width="412" height="1" fill="#334155"/>
  <text x="690" y="646" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="16">Privacy-first mobile SLM playground</text>
</svg>
